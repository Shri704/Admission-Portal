<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Admission Portal</title>
    <meta
      name="description"
      content="A complete online admission and fee management system for engineering students."
    />
    <meta name="theme-color" content="#1e40af" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/portal-icon.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased bg-gray-50 text-gray-800 font-inter">

      <!-- Optional Loading Screen -->
      <div class="flex h-screen items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800">
        <div class="text-center animate-pulse text-white">
          <img src="/logo.svg" alt="Portal Logo" class="mx-auto w-20 mb-4 animate-bounce" />
          <h1 class="text-3xl font-bold">Engineering Admission Portal</h1>
          <p class="mt-2 text-gray-200 text-sm tracking-wide">Loading the future of education...</p>

      </div>
